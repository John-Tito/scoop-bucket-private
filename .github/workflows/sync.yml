name: Sync with BucketTemplate

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Template Sync
        uses: AndreasAugustin/actions-template-sync@v2
        with:
          source_repo_path: ScoopInstaller/BucketTemplate
          upstream_branch: main
          template_sync_ignore_file_path: .templatesyncignore
          target_gh_token: ${{ secrets.GITHUB_TOKEN }}
